name: neko_chemistry
resolution: workspace
description: "猫と学ぶ高校化学 - デザイン重視の一問一答クイズアプリ"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

# アプリアイコン: `dart run flutter_launcher_icons` で各プラットフォームに書き出す。
# 元データは tool/generate_icons.dart(猫マスコットのCatPainterを1024角に描画するスクリプト)。
flutter_launcher_icons:
  image_path: "icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#FFF8EF"
  adaptive_icon_foreground: "icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "icon/icon.png"
  web:
    generate: true
    image_path: "icon/icon.png"
    background_color: "#FFF8EF"
    theme_color: "#E8873A"

flutter:
  uses-material-design: true

  assets:
    - assets/questions.json
