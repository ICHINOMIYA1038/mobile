<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H9;src:local('HiraginoSans-W9')}
@font-face{font-family:H8;src:local('HiraginoSans-W8')}

.title{position:absolute;left:0;right:0;top:178px;text-align:center;color:#FFFFFF;line-height:1;white-space:nowrap}
.fp{font-size:330px;letter-spacing:-0.04em}
.kyu{font-size:250px;margin-left:0.02em}
.band{position:absolute;left:82px;right:82px;top:690px;height:180px;border-radius:36px;background:#F2C94C;display:flex;align-items:center;justify-content:center;font-family:H8;font-size:112px;color:#1C3357;letter-spacing:-0.01em}
.band b{font-weight:normal;color:#FFFFFF;-webkit-text-stroke:0}
.band .ai{color:#1C3357;font-family:H9}

<div class="marker"></div>
<div class="title" style="z-index:1"><span class="fp">FP1</span><span class="kyu">級</span></div>
