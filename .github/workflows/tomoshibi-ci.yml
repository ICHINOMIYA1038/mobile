name: tomoshibi CI

on:
  push:
    branches: [main]
    paths:
      - "apps/tomoshibi/**"
      - ".github/workflows/tomoshibi-ci.yml"
  pull_request:
    paths:
      - "apps/tomoshibi/**"
      - ".github/workflows/tomoshibi-ci.yml"

defaults:
  run:
    working-directory: apps/tomoshibi

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 手元のビルドと揃える。3.47 から package:flutter/material.dart が非推奨になり、
          # 最新の stable では analyze が既存のコードで落ちる（2026-11-14）
          flutter-version: 3.44.8

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
